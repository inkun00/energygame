name: Prepare verified web release
on:
  push:
    branches: [qa/web-release-prep-20261120]
permissions:
  contents: read
env:
  GAME_SHA: 406894adbc2484cce6cb516295f644df65a88453
jobs:
  worker-connection:
    runs-on: ubuntu-24.04
    steps:
      - name: Check existing Worker deployment configuration
        env:
          TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "Worker deployment token configured: $TOKEN_CONFIGURED"
          echo "Worker account identifier configured: $ACCOUNT_CONFIGURED"
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 406894adbc2484cce6cb516295f644df65a88453
          lfs: true
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Verify the target, import, and export the Web preset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GAME_SHA"
          mkdir -p build/web
          godot --headless --editor --import > "$RUNNER_TEMP/first-import.log" 2>&1
          godot --headless --editor --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          godot --headless --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP"/{import,export}.log; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Worker & browser runtime unit tests before packaging
        working-directory: services/room-directory
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test test/*.test.js
          node --test ../../scripts/tests/WebRoomFrames.test.mjs
      - name: Verify offline network negotiation rules
        shell: bash
        run: |
          set -euo pipefail
          for regression in NetworkRecoveryRulesTest NetworkPayloadSmokeTest AllMiniGamePracticeTest; do
            godot --headless --path . --script "scripts/tests/$regression.gd" 2>&1 | tee "$RUNNER_TEMP/$regression.log"
            if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]|^ERROR:' "$RUNNER_TEMP/$regression.log"; then exit 1; fi
          done
      - name: Verify and zip only the exported game
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          web = Path("build/web")
          files = sorted(p for p in web.iterdir() if p.is_file() and not p.name.startswith(".") and p.suffix != ".import")
          names = {p.name for p in files}
          assert {"index.html", "index.js", "index.pck", "index.wasm"} <= names
          assert (web / "index.pck").read_bytes()[:4] == b"GDPC"
          assert (web / "index.wasm").read_bytes()[:4] == b"\0asm"
          html = (web / "index.html").read_text()
          sizes = json.loads(re.search(r'"fileSizes"\s*:\s*(\{[^}]+\})', html).group(1))
          assert all((web / name).stat().st_size == size for name, size in sizes.items())
          assert (web / "index.pck").stat().st_size > 1000000
          zip_path = Path("energygame-web.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as out:
              for f in files:
                  out.write(f, f.name)
          with zipfile.ZipFile(zip_path) as saved:
              assert saved.testzip() is None and set(saved.namelist()) == names
              assert all(hashlib.sha256(saved.read(f.name)).digest() == hashlib.sha256(f.read_bytes()).digest() for f in files)
          print(f"{len(files)} game files | {zip_path.stat().st_size} bytes | sha256={hashlib.file_digest(zip_path.open('rb'), 'sha256').hexdigest()}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: game-web
          path: energygame-web.zip
          compression-level: 0
          retention-days: 3
  publish:
    if: ${{ true }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-web
      - name: Publish release and verify the asset GitHub serves
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="web-$GAME_SHA"
          gh api --header 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/release-prep/worker.mjs?ref=$GITHUB_SHA" > worker.mjs
          echo "0c53584436bd782672d5c3dd4ab34649e886248da6d9bf812ae31eec9087bf38  worker.mjs" | sha256sum -c -
          node --check worker.mjs
          if ! gh release view "$tag" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$tag" energygame-web.zip worker.mjs --repo "$GH_REPO" --target "$GAME_SHA" --title "온라인 모험 중계 자격 증명 발급 수정" --notes "브라우저가 직접 연결할 수 없을 때 사용할 단기 중계 자격 증명 발급을 수정하고 TLS 443 연결을 지원합니다."
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$GAME_SHA"
          mkdir -p "$RUNNER_TEMP/release-download"
          gh release download "$tag" --repo "$GH_REPO" --pattern energygame-web.zip --dir "$RUNNER_TEMP/release-download"
          cmp energygame-web.zip "$RUNNER_TEMP/release-download/energygame-web.zip"
          gh release download "$tag" --repo "$GH_REPO" --pattern worker.mjs --dir "$RUNNER_TEMP/release-download"
          cmp worker.mjs "$RUNNER_TEMP/release-download/worker.mjs"
          sha256sum energygame-web.zip worker.mjs
  verify-live:
    if: ${{ true }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-web
      - name: Verify the production game and ranking API
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time, urllib.request, zipfile
          base = "https://energygame-minigames-demo.vercel.app/"
          sha = os.environ["GAME_SHA"]
          with zipfile.ZipFile("energygame-web.zip") as archive:
              expected_html = archive.read("index.html")
              expected_pck = hashlib.sha256(archive.read("index.pck")).hexdigest()
          def fetch(path):
              req = urllib.request.Request(base + path, headers={"Cache-Control": "no-cache", "User-Agent": "energygame-release-validation"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read()
          for attempt in range(65):
              try:
                  html = fetch("?release=" + sha + "&check=" + str(attempt))
                  if html == expected_html:
                      digest = hashlib.sha256(fetch("index.pck?release=" + sha + "&check=" + str(attempt))).hexdigest()
                      if digest == expected_pck:
                          board = json.loads(fetch("api/scores/solar_align"))
                          assert board["game_id"] == "solar_align" and isinstance(board["entries"], list)
                          print(f"Production matches game={sha} html_sha256={hashlib.sha256(expected_html).hexdigest()} pck_sha256={digest}; scores={board['game_id']}")
                          break
              except Exception as error:
                  print(type(error).__name__, flush=True)
              time.sleep(12)
          else:
              raise RuntimeError("Production is not yet serving the release")
          PY
