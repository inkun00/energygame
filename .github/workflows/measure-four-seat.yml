name: Measure four-seat end-to-end game traffic
on:
  push:
    branches: [qa/measure-four-seat-20261120]
permissions:
  contents: read
jobs:
  game:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    name: Full native match (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Prepare game and private counters
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = candidate ]; then git apply --ignore-space-change .qa/network.patch; fi
          python3 .qa/instrument_game_args.py scripts/network/NetworkManager.gd
          python3 .qa/window.py
          gcc -O2 -fPIC -shared .qa/io.c -ldl -o .qa/io.so
          chmod +x .qa/wrapper.sh
          command -v tcpdump || (sudo apt-get update -qq && sudo apt-get install -y tcpdump)
          godot --headless --editor --import
      - name: Measure four peers from admission through ending
        run: |
          set -euo pipefail
          export GODOT_REAL="$(command -v godot)" GODOT_BIN="$PWD/.qa/wrapper.sh"
          sudo bash -c 'echo $$ > /tmp/game-capture.pid; exec tcpdump -i lo -n -q -l -tt "udp port 18921 and host 127.0.0.1"' > /tmp/game-packets.log 2> /tmp/game-capture-status.log &
          capture=$!
          for i in $(seq 1 100); do if grep -q 'listening on' /tmp/game-capture-status.log; then break; fi; sleep .1; done
          grep -q 'listening on' /tmp/game-capture-status.log
          result=0
          node scripts/tests/run_four_player_online_test.cjs || result=$?
          sudo kill -INT "$(cat /tmp/game-capture.pid)" || true
          wait "$capture" || true
          cat /tmp/game-capture-status.log
          python3 .qa/summary.py
          exit "$result"
