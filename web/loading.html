<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071e25">
<title>재생 에너지 탐험대</title>
$GODOT_HEAD_INCLUDE
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071e25;color:#edf9ed;font-family:"Malgun Gothic",Arial,sans-serif}
#canvas{display:block;margin:0;outline:0}
#loading{position:fixed;inset:0;z-index:1000;display:flex;overflow:auto;padding:clamp(18px,3vw,36px);background:radial-gradient(ellipse at 35% 40%,#174c45 0%,#092d32 48%,#061820 100%)}
.content{flex:none;display:grid;gap:22px;width:min(660px,100%);margin:auto;text-align:center}
.loading-art{width:100%;max-width:660px;aspect-ratio:3/2;justify-self:center;margin:0;overflow:hidden;border:1px solid #83d7ab36;border-radius:24px;background:#103b39;box-shadow:0 18px 60px #00000035}
.loading-art img{display:block;width:100%;height:100%;object-fit:contain}
.loading-copy{min-width:0}
.eyebrow{font-size:11px;line-height:1.6;letter-spacing:3px;color:#9dd9bf}
h1{font-size:clamp(28px,5.3vw,40px);line-height:1.25;letter-spacing:-1.5px;text-wrap:balance;color:#ffe08b;margin:12px 0 8px}
p{color:#b9d8d0;font-size:15px;line-height:1.8;margin:0}
.track{margin-top:26px}
progress{display:block;appearance:none;width:100%;height:12px;border:0;border-radius:20px;overflow:hidden;background:#ffffff15}
progress::-webkit-progress-bar{background:#ffffff15;border-radius:20px}
progress::-webkit-progress-value{background:linear-gradient(90deg,#44cba0,#e7ec89);border-radius:20px}
progress::-moz-progress-bar{background:#72dcab;border-radius:20px}
.status{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;line-height:1.6;color:#b9d8d0;margin-top:10px;gap:12px;text-align:left}
#percent{flex:none;font-variant-numeric:tabular-nums}
.tip{margin-top:22px;font-size:13px;color:#9ac2b6}
#retry{border:1px solid #ffe08b;background:#ffe08b;color:#102a2c;padding:12px 26px;border-radius:10px;font:inherit;cursor:pointer;margin-top:16px}
#retry:focus-visible{outline:3px solid #edf9ed;outline-offset:4px}
#error{color:#ffd2c9;white-space:pre-line;margin-top:18px}
#loading.done{opacity:0;pointer-events:none;transition:opacity .3s}
@media(min-width:960px),(min-width:700px) and (max-height:480px){
  .content{width:min(1160px,100%);grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:clamp(22px,3vw,40px)}
  .loading-copy{text-align:left}
  h1{font-size:clamp(28px,3.2vw,44px)}
}
@media(max-width:959px) and (min-height:481px) and (max-height:650px){
  .content{gap:16px}
  .loading-art{width:min(100%,48vh)}
  .track{margin-top:20px}
  .tip{margin-top:16px}
}
@media(max-width:699px) and (max-height:480px){
  .content{gap:14px}
  .loading-art{width:min(100%,36vh)}
  .track{margin-top:18px}
  .tip{margin-top:14px}
}
@media(prefers-reduced-motion:reduce){#loading.done{transition:none}}
</style>
</head>

    <div class="loading-copy">
    <h1>재생 에너지 탐험대</h1>
    <div class="track"><progress id="progress" max="100" value="0" aria-label="게임 다운로드 진행률"></progress></div>
    <div class="status" role="status"><span id="stage">모험을 준비하고 있어요</span><span id="percent">0%</span></div>
    <p class="tip">필요한 부품을 모아, 마을에 전기를 보내요.</p>
    <p id="error" role="alert" hidden></p>
    <button id="retry" hidden onclick="location.reload()">다시 불러오기</button>

</section>
<script>
if (new URLSearchParams(location.search).has('minigames') || new URLSearchParams(location.search).has('minigame')) {
  document.title = '에코 히어로즈 · 에너지 미니게임';
  document.querySelector('#loading h1').textContent = '에너지 미니게임';
  document.querySelector('#loading .tip').textContent = '미션을 골라 AI 3명과 함께 도전해요.';
}
// Register only while a game session is open, including market/construction.
// Browser chrome refresh/close uses its own confirmation text for security.
(() => {
  let guarded = false;
  function confirmLeave(event) {
    event.preventDefault();
    event.returnValue = true;
  }
  window.energyGameSetExitGuard = function (active) {
    if (guarded === Boolean(active)) return;
    guarded = Boolean(active);
    if (guarded) window.addEventListener('beforeunload', confirmLeave);
    else window.removeEventListener('beforeunload', confirmLeave);
  };
})();
window.energyGameReady = function () {
  const overlay = document.getElementById('loading');
  if (!overlay) return;
  overlay.classList.add('done');
  setTimeout(() => overlay.remove(), 320);
};
</script>
<script src="$GODOT_URL"></script>
<script>
(() => {
  const progress = document.getElementById('progress');
  const percent = document.getElementById('percent');
  const stage = document.getElementById('stage');
  function fail(error) {
    console.error(error);
    stage.textContent = '게임을 불러오지 못했어요';
    const notice = document.getElementById('error');
    notice.textContent = '인터넷 연결을 확인하고 다시 불러오기를 눌러 주세요.\n계속 실패하면 최신 Chrome 또는 Edge에서 실행해 주세요.';
    notice.hidden = false;
    document.getElementById('retry').hidden = false;
  }
  if (typeof Engine === 'undefined') { fail('Engine download failed'); return; }
  const config = $GODOT_CONFIG;
  const missing = Engine.getMissingFeatures({threads: $GODOT_THREADS_ENABLED});
  if (missing.length) { fail(missing.join(', ')); return; }
  const engine = new Engine(config);
  engine.startGame({onProgress(current, total) {
    if (total > 0) {
      const value = Math.min(100, Math.floor(current / total * 100));
      progress.value = value;
      percent.textContent = value + '%';
      stage.textContent = value < 100 ? '게임을 불러오는 중...' : '모험 화면을 준비하는 중...';
    } else {
      progress.removeAttribute('value');
      percent.textContent = '';
    }
  }}).catch(fail);
})();
</script>
